<script>
/*CORE_START*/
/* =====================================================================
   NÚCLEO DE DATOS (sin DOM): lectura con SheetJS, normalización de
   fechas/horas/coordenadas, geocercas, incidencias y rastreo GPS.
   ===================================================================== */
const Core = (() => {
  'use strict';
  const pad = n => String(n).padStart(2, '0');
  const str = v => (v === null || v === undefined) ? '' : String(v).trim();
  const lc = v => str(v).toLowerCase();
  const norm = s => str(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  const mkKey = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  const dayNum = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  const numKey = n => { const t = new Date(n * 86400000); return mkKey(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
  const keyNum = k => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(k || ''); return m ? dayNum(+m[1], +m[2], +m[3]) : NaN; };
  const EPOCH = Date.UTC(1899, 11, 30);

  function todayKey() { const d = new Date(); return mkKey(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  function weekRange(k) { const n = keyNum(k); const dow = (new Date(n * 86400000).getUTCDay() + 6) % 7; return { from: numKey(n - dow), to: numKey(n - dow + 6) }; }
  function monthRange(k) { const y = +k.slice(0, 4), m = +k.slice(5, 7); return { from: mkKey(y, m, 1), to: mkKey(y, m, new Date(Date.UTC(y, m, 0)).getUTCDate()) }; }
  function daysBetween(a, b) { const out = []; for (let n = keyNum(a); n <= keyNum(b); n++) out.push(numKey(n)); return out; }

  function serialParts(n) { const t = new Date(EPOCH + Math.floor(n) * 86400000); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }
  function validYMD(y, m, d) { if (!(y > 1990 && y < 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return false; return new Date(Date.UTC(y, m - 1, d)).getUTCMonth() === m - 1; }

  /* Fecha → {y,m,d,src}. src: 'serial' (número de Excel) | 'text' | 'date'. Texto ambiguo: MDY por defecto. */
  function parseDate(v, order) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate(), src: 'date' };
    if (typeof v === 'number') { if (!isFinite(v) || v < 20000 || v > 80000) return null; return Object.assign(serialParts(v), { src: 'serial' }); }
    const s = str(v); if (!s) return null;
    if (/^\d{5}(\.\d+)?$/.test(s)) return Object.assign(serialParts(parseFloat(s)), { src: 'serial' });
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) { const o = { y: +m[1], m: +m[2], d: +m[3], src: 'text' }; return validYMD(o.y, o.m, o.d) ? o : null; }
    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if (m) {
      let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
      let mo, d;
      if (a > 12 && b <= 12) { d = a; mo = b; }
      else if (b > 12 && a <= 12) { mo = a; d = b; }
      else if ((order || 'MDY') === 'DMY') { d = a; mo = b; } else { mo = a; d = b; }
      return validYMD(y, mo, d) ? { y, m: mo, d, src: 'text' } : null;
    }
    return null;
  }

  /* Hora → segundos del día (acepta fracción de día de Excel o texto HH:MM[:SS] [AM/PM]) */
  function parseTime(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') { if (!isFinite(v)) return null; return Math.round((v - Math.floor(v)) * 86400) % 86400; }
    const s = str(v);
    let m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?[Mm]\.?)?$/);
    if (m) {
      let h = +m[1]; const mi = +m[2], se = +(m[3] || 0); const ap = m[4];
      if (ap) { const p = ap[0].toLowerCase() === 'p'; if (p && h < 12) h += 12; if (!p && h === 12) h = 0; }
      if (h > 23 || mi > 59) return null; return h * 3600 + mi * 60 + se;
    }
    if (/^\d*\.\d+$/.test(s)) return parseTime(parseFloat(s));
    return null;
  }
  const hm = sec => sec == null ? '—' : pad(Math.floor(sec / 3600) % 24) + ':' + pad(Math.floor(sec % 3600 / 60));
  const hms = sec => sec == null ? '—' : hm(sec) + ':' + pad(sec % 60);
  const wrapHours = (a, b) => ((((b - a) % 86400) + 86400) % 86400) / 3600;
  const round2 = n => Math.round(n * 100) / 100;
  function parseNum(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const n = parseFloat(str(v).replace(',', '.')); return isNaN(n) ? null : n;
  }

  /* Coordenadas "14.49, -90.56" → {valid, lat, lng}. 0,0 = sin ubicación */
  function parseGeo(v) {
    const s = str(v);
    if (!s) return { raw: '', valid: false, empty: true };
    const m = s.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
    if (!m) return { raw: s, valid: false };
    const lat = +m[1], lng = +m[2];
    if (Math.abs(lat) < 1e-6 && Math.abs(lng) < 1e-6) return { raw: s, lat, lng, valid: false, zero: true };
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return { raw: s, valid: false };
    return { raw: s, lat, lng, valid: true };
  }
  function haversine(a, b, c, d) {
    const R = 6371000, r = Math.PI / 180, dLa = (c - a) * r, dLo = (d - b) * r;
    const x = Math.sin(dLa / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
  function median(a) { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; }

  /* ---------- Lectura de libros ---------- */
  function detectKind(name, keys) {
    const k = new Set(keys), n = norm(name);
    if (k.has('horas_ordinarias') || k.has('hora_salida') || k.has('fecha_salida')) return 'general';
    if (k.has('coordenadas') || k.has('email_empleado')) return 'rastreo';
    if (k.has('first_name') || k.has('last_name') || k.has('seguros_de_accidentes')) return 'base';
    if (n.indexOf('rastreo') >= 0) return 'rastreo';
    if (n.indexOf('general') >= 0) return 'general';
    if (n.indexOf('base') >= 0) return 'base';
    return null;
  }
  function parseWorkbook(buf, fileName) {
    const isCsv = /\.(csv|txt)$/i.test(fileName || '');
    const wb = XLSX.read(buf, isCsv ? { type: 'array', raw: true } : { type: 'array' });
    const sheets = {}, found = [];
    wb.SheetNames.forEach(name => {
      const ws = wb.Sheets[name]; if (!ws) return;
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
      const nrows = rows.map(r => { const o = {}; Object.keys(r).forEach(k => { o[norm(k)] = r[k]; }); return o; })
        .filter(o => Object.keys(o).some(k => str(o[k]) !== ''));
      if (!nrows.length) return;
      const kind = detectKind(name, Object.keys(nrows[0]));
      if (!kind) return;
      if (!sheets[kind] || sheets[kind].length < nrows.length) sheets[kind] = nrows;
      found.push(name + ' → ' + kind);
    });
    return { wb, sheets, found, isXlsx: !isCsv };
  }

  /* ---------- Modelo ---------- */
  function buildModel(raw, cfg, todayK) {
    cfg = cfg || {}; todayK = todayK || todayKey();
    const order = cfg.textDateOrder || 'MDY', fixOn = cfg.fixDates !== false;
    const maxOrd = +cfg.maxOrd || 12, maxExtra = +cfg.maxExtra || 12, defRadius = +cfg.defaultRadius || 1000;
    const todayN = keyNum(todayK);

    // Empleados
    const empMap = new Map(), employees = [];
    const mkEmp = o => {
      const e = Object.assign({ email: '', first: '', last: '', puesto: '', direccion: '', cell: '', seguro: '', course: '', seccion: '', inBase: false }, o);
      e.name = (e.first + ' ' + e.last).replace(/\s+/g, ' ').trim() || (e.email ? e.email.split('@')[0] : 'Sin nombre');
      e.initials = ((e.first[0] || '') + (e.last[0] || '')).toUpperCase() || e.name.slice(0, 2).toUpperCase();
      return e;
    };
    (raw.base || []).forEach(r => {
      const email = lc(r.email), first = str(r.first_name), last = str(r.last_name);
      if (!email && !first && !last) return;
      const e = mkEmp({ email, first, last, puesto: str(r.puesto), direccion: str(r.direccion), cell: str(r.cell), seguro: str(r.seguros_de_accidentes), course: str(r.course).toUpperCase(), seccion: str(r.seccion_activa).toUpperCase(), inBase: true });
      employees.push(e); if (email) empMap.set(email, e);
    });
    const ensureEmp = (email, course) => {
      let e = empMap.get(email);
      if (!e) { e = mkEmp({ email, course: course || '' }); empMap.set(email, e); employees.push(e); }
      return e;
    };

    // Rango de referencia para detectar fechas con día/mes invertidos
    const refNums = [];
    (raw.rastreo || []).forEach(r => { const p = parseDate(r.fecha, order); if (p) refNums.push(dayNum(p.y, p.m, p.d)); });
    (raw.general || []).forEach(r => ['date', 'fecha_salida', 'fecha_entrada_extra', 'fecha_salida_extra'].forEach(k => {
      const p = parseDate(r[k], order); if (p && (p.src !== 'serial' || p.d > 12)) refNums.push(dayNum(p.y, p.m, p.d));
    }));
    const ref = refNums.length ? { lo: refNums.reduce((a, b) => Math.min(a, b)), hi: refNums.reduce((a, b) => Math.max(a, b)) } : { lo: todayN - 45, hi: todayN };
    const distTo = n => n < ref.lo ? ref.lo - n : n > ref.hi ? n - ref.hi : 0;
    let fixedCount = 0, skipped = 0;
    const getDate = v => {
      const p = parseDate(v, order); if (!p) return null;
      let q = p, fixed = false;
      if (fixOn && p.src === 'serial' && p.d <= 12 && p.m !== p.d) {
        if (distTo(dayNum(p.y, p.d, p.m)) < distTo(dayNum(p.y, p.m, p.d))) { q = { y: p.y, m: p.d, d: p.m }; fixed = true; }
      }
      return { key: mkKey(q.y, q.m, q.d), num: dayNum(q.y, q.m, q.d), fixed };
    };

    // Jornadas
    const records = [];
    (raw.general || []).forEach((r, i) => {
      const email = lc(r.email), ent = getDate(r.date);
      if (!email || !ent) { skipped++; return; }
      const course = str(r.course).toUpperCase();
      const entrySec = parseTime(r.time), exitSec = parseTime(r.hora_salida);
      const ex = getDate(r.fecha_salida), xi = getDate(r.fecha_entrada_extra), xo = getDate(r.fecha_salida_extra);
      const xinSec = parseTime(r.hora_entrada_extra), xoutSec = parseTime(r.hora_salida_extra);
      const hasExit = exitSec != null, hasExtra = xinSec != null;
      const estado = str(r.estado).toUpperCase() || (hasExit ? 'COMPLETADO' : 'PENDIENTE');
      const ordR = parseNum(r.horas_ordinarias), extR = parseNum(r.horas_extras), totR = parseNum(r.horas_totales);
      const calcOrd = (hasExit && entrySec != null) ? round2(wrapHours(entrySec, exitSec)) : null;
      const calcExt = (hasExtra && xoutSec != null) ? round2(wrapHours(xinSec, xoutSec)) : null;
      let ordEff = ordR == null ? (calcOrd || 0) : ordR, extEff = extR == null ? (calcExt || 0) : extR, negFix = false;
      if (ordEff < 0) { ordEff = calcOrd != null ? calcOrd : 0; negFix = true; }
      if (extEff < 0) { extEff = calcExt != null ? calcExt : 0; negFix = true; }
      let totEff = (totR == null || totR < 0 || negFix) ? round2(ordEff + extEff) : totR;
      if (totR != null && totR < 0) negFix = true;
      const entryTs = ent.num * 86400 + (entrySec || 0);
      const exitTs = (ex && hasExit) ? ex.num * 86400 + exitSec : null;
      records.push({
        id: str(r.id) || ('r' + i), email, course, dateKey: ent.key, entrySec,
        exitKey: ex ? ex.key : null, exitSec, hasExit, hasExtra,
        xinKey: xi ? xi.key : null, xinSec, xoutKey: xo ? xo.key : null, xoutSec,
        geo: { entry: parseGeo(r.geolocalizacion), exit: hasExit ? parseGeo(r.geolocalizacion_salida) : null,
               xin: hasExtra ? parseGeo(r.geolocalizacion_entrada_extra) : null,
               xout: (hasExtra && xoutSec != null) ? parseGeo(r.geolocalizacion_salida_extra) : null },
        ordR, extR, totR, ordEff, extEff, totEff, negFix, calcOrd, estado,
        pending: !hasExit || estado.indexOf('PENDIENTE') >= 0,
        entryTs, exitTs, exitBefore: exitTs != null && exitTs < entryTs - 60,
        dateFixed: !!(ent.fixed || (ex && ex.fixed) || (xi && xi.fixed)), flags: [], inc: 0, incDanger: 0, incWarn: 0
      });
      if (ent.fixed || (ex && ex.fixed) || (xi && xi.fixed)) fixedCount++;
    });
    records.sort((a, b) => a.entryTs - b.entryTs);

    // Centros automáticos por sitio (mediana de marcas válidas)
    const byCourse = {};
    records.forEach(rec => ['entry', 'exit', 'xin', 'xout'].forEach(k => {
      const g = rec.geo[k]; if (!g || !g.valid) return;
      const c = rec.course || (empMap.get(rec.email) || {}).course || '';
      if (!byCourse[c]) byCourse[c] = { lat: [], lng: [] };
      byCourse[c].lat.push(g.lat); byCourse[c].lng.push(g.lng);
    }));
    const centers = {};
    Object.keys(byCourse).forEach(c => { centers[c] = { lat: median(byCourse[c].lat), lng: median(byCourse[c].lng), n: byCourse[c].lat.length }; });
    const fence = course => {
      const g = (cfg.geofences || {})[course] || {}, mode = g.mode || 'auto';
      if (mode === 'off') return null;
      const radius = parseNum(g.radius) || defRadius;
      if (mode === 'manual' && parseNum(g.lat) !== null && parseNum(g.lng) !== null) return { lat: parseNum(g.lat), lng: parseNum(g.lng), radius, mode: 'manual' };
      const c = centers[course]; return c ? { lat: c.lat, lng: c.lng, radius, mode: 'auto' } : null;
    };
    const stOf = (g, f) => {
      if (!g) return null;
      const o = Object.assign({}, g);
      if (!g.valid) o.st = 'none';
      else if (!f) o.st = 'ok';
      else { o.dist = haversine(g.lat, g.lng, f.lat, f.lng); o.st = o.dist > f.radius ? 'out' : 'ok'; }
      return o;
    };

    // Estados de ubicación e incidencias
    const LBL = { entry: 'Entrada', exit: 'Salida', xin: 'Entrada extra', xout: 'Salida extra' };
    records.forEach(rec => {
      const emp = ensureEmp(rec.email, rec.course);
      if (!rec.course) rec.course = emp.course;
      const f = fence(rec.course);
      ['entry', 'exit', 'xin', 'xout'].forEach(k => { rec.geo[k] = stOf(rec.geo[k], f); });
      const fl = rec.flags, add = (code, lvl, txt, detail) => fl.push({ code, lvl, txt, detail: detail || '' });
      ['entry', 'exit', 'xin', 'xout'].forEach(k => {
        const g = rec.geo[k]; if (!g) return;
        if (g.st === 'none') add('SIN_UBIC', 'danger', LBL[k] + ' sin ubicación', g.zero ? 'Coordenadas 0,0' : 'Sin coordenadas válidas');
        else if (g.st === 'out') add('FUERA_RANGO', 'warn', LBL[k] + ' fuera de rango', 'A ' + fmtDist(g.dist) + ' del sitio');
      });
      if (!rec.hasExit) {
        if (rec.dateKey < todayK) add('SIN_SALIDA', 'danger', 'Salida no marcada', 'Jornada sin cierre');
        else add('EN_CURSO', 'info', 'Jornada en curso');
      }
      if (rec.negFix) add('HORAS_NEG', 'danger', 'Horas negativas', 'Reportado ' + (rec.ordR != null ? rec.ordR : '') + ' h; corregido a ' + rec.totEff + ' h');
      if (rec.ordEff > maxOrd) add('JORNADA_LARGA', 'warn', 'Jornada de ' + round2(rec.ordEff) + ' h', 'Supera ' + maxOrd + ' h ordinarias');

}
function viewHist() {

    '<label class="text-xs text-slate-400">Desde<br><input type="date" data-chg="hist-from" value="' + esc(h.from) + '" class="mt-1 ' + INPC + '"></label><label class="text-xs text-slate-400">Hasta<br><input type="date" data-chg="hist-to" value="' + esc(h.to) + '" class="mt-1 ' + INPC + '"></label><button data-act="hist-clear" class="' + BTN + '">Todo el historial</button></div>' +

function initHistMap() {
  const el = $('#map-hist'); if (!el) return; const M = S.model, h = S.hist;
  const all = (M.track[h.email] || {})[h.trackDate] || [], pts = all.filter(p => p.valid);
  if (!pts.length) { el.innerHTML = noMap('Sin puntos GPS válidos para este día.'); return; }
  if (typeof L === 'undefined') { el.innerHTML = noMap(); return; }
  const line = pts.map(p => [p.lat, p.lng]), bounds = L.latLngBounds();
  const map = L.map(el, { zoomAnimation: false, fadeAnimation: false }).setView(line[0], 15); S.maps.hist = map; addBaseMap(map);
  line.forEach(ll => bounds.extend(ll));
  L.polyline(line, { color: '#38bdf8', weight: 3, opacity: .85 }).addTo(map);
  pts.forEach(p => L.circleMarker([p.lat, p.lng], { radius: 3, color: '#38bdf8', weight: 1, fillColor: '#0b1220', fillOpacity: 1 }).addTo(map));
  const start = pts[0], end = pts[pts.length - 1];
  L.circleMarker([start.lat, start.lng], { radius: 8, color: '#0b1220', weight: 2, fillColor: '#34d399', fillOpacity: 1 }).addTo(map);
  L.circleMarker([end.lat, end.lng], { radius: 8, color: '#0b1220', weight: 2, fillColor: '#fb7185', fillOpacity: 1 }).addTo(map);
  M.records.filter(r => r.email === h.email && r.dateKey === h.trackDate).forEach(r => {
    [['entry', 'Entrada', '#22d3ee', r.entrySec], ['exit', 'Salida', '#fbbf24', r.exitSec]].forEach(m => {
      const g = r.geo[m[0]];
      if (g && g.valid) {
        const ll = [g.lat, g.lng]; bounds.extend(ll);
        L.circleMarker(ll, { radius: 6, color: m[2], weight: 3, fillColor: '#0b1220', fillOpacity: 1 }).addTo(map);
      }
    });
  });
  const emp = empOf(h.email), fence = emp && M.fence(emp.course);
  if (fence) {
    const circle = L.circle([fence.lat, fence.lng], { radius: fence.radius, color: '#a78bfa', weight: 2, dashArray: '6 5', fillColor: '#a78bfa', fillOpacity: .08 })
      .addTo(map);

  }

  else map.setView(line[0], 15);
}

function saveSettings() {

    if (txt && !(o.apiKey && o.databaseURL)) { toast('Falta apiKey o databaseURL. Crea una Realtime Database en tu proyecto y copia su URL.', 'bad'); return; }
